<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Differential Privacy for Beginners</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #070b14;
      --bg-accent: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.5);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-color: #38bdf8;
      --border-color: rgba(255, 255, 255, 0.08);
      --radius: 16px;
    }

    * { box-sizing: border-box; }
    
    body {
      margin: 0;
      padding: 0;
      font-family: "Inter", sans-serif;
      color: var(--text-main);
      background-color: var(--bg-dark);
      /* Elegant gradient background */
      background: 
        radial-gradient(circle at 0% 0%, rgba(56, 189, 248, 0.1) 0%, transparent 40%),
        radial-gradient(circle at 100% 100%, rgba(99, 102, 241, 0.1) 0%, transparent 40%),
        var(--bg-dark);
      min-height: 100vh;
      line-height: 1.5;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 60px 24px;
    }

    /* Header Styling - No background box as requested */
    header {
      margin-bottom: 60px;
    }

    .header-content {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 20px;
    }

    h1 {
      font-size: clamp(32px, 5vw, 48px);
      font-weight: 700;
      margin: 0 0 16px 0;
      letter-spacing: -0.03em;
      background: linear-gradient(to right, #fff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 18px;
      color: var(--text-muted);
      max-width: 600px;
      margin: 0;
    }

    .hint-badge {
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      border-radius: 100px;
      font-size: 13px;
      color: var(--accent-color);
      font-weight: 500;
    }

    /* The Grid - Now naturally scrollable with the page */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 24px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(10px);
    }

    .card:hover {
      transform: translateY(-8px);
      border-color: rgba(56, 189, 248, 0.4);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      background: rgba(30, 41, 59, 0.8);
    }

    .cover-img {
      width: 100%;
      aspect-ratio: 16/9;
      background: #1e293b;
      display: none; /* Only shown if image loads */
      object-fit: cover;
    }

    .card-body {
      padding: 24px;
    }

    .part-tag {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent-color);
      margin-bottom: 12px;
      display: block;
    }

    h2 {
      font-size: 20px;
      margin: 0 0 10px 0;
      font-weight: 600;
    }

    .card p {
      color: var(--text-muted);
      font-size: 15px;
      margin: 0 0 20px 0;
      min-height: 45px;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: 500;
      border-top: 1px solid var(--border-color);
      padding-top: 16px;
    }

    .btn-text {
      color: var(--accent-color);
    }

    footer {
      margin-top: 80px;
      padding-top: 24px;
      border-top: 1px solid var(--border-color);
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
    }

    /* Mobile adjustments */
    @media (max-width: 640px) {
      .container { padding: 40px 20px; }
      .header-content { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>

<body>
  <div class="container">
    <header>
      <div class="header-content">
        <div>
          <h1>Differential Privacy for Beginners</h1>
          <p class="subtitle">These notes reflect my personal understanding of differential privacy, with the goal of explaining the core intuition to students.</p>
        </div>
        <div class="hint-badge">Click a card to read</div>
      </div>
    </header>

    <main class="grid">
      <script>
        // Data for the first two parts you already have
        const partsData = [
          { title: "Introduction", desc: "Background, motivation, and common failures", link: "part1.html", img: "part1.jpeg" },
          { title: "Reconstruction Attacks", desc: "How statistics can reveal the dataset", link: "part2.html", img: "part2.jpeg" },
          { title: "(Next)", desc: "Coming soon", link: "part3.html", img: "part3.jpeg" },
          { title: "(Next)", desc: "Coming soon", link: "part4.html", img: "part4.jpeg" },
          { title: "(Next)", desc: "Coming soon", link: "part5.html", img: "part5.jpeg" },
          { title: "(Next)", desc: "Coming soon", link: "part6.html", img: "part6.jpeg" },
          { title: "(Next)", desc: "Coming soon", link: "part7.html", img: "part7.jpeg" },
          { title: "(Next)", desc: "Coming soon", link: "part8.html", img: "part8.jpeg" },
          { title: "(Next)", desc: "Coming soon", link: "part9.html", img: "part9.jpeg" },
          { title: "(Next)", desc: "Coming soon", link: "part10.html", img: "part10.jpeg" },
          { title: "(Next)", desc: "Coming soon", link: "part11.html", img: "part11.jpeg" },
          { title: "(Next)", desc: "Coming soon", link: "part12.html", img: "part12.jpeg" }
        ];

        // Generate the 12 cards automatically
        const grid = document.querySelector('.grid');
        partsData.forEach((item, index) => {
          const card = document.createElement('a');
          card.className = 'card';
          card.href = item.link;
          card.innerHTML = `
            <img class="cover-img" src="${item.img}" alt="" onerror="this.style.display='none'">
            <div class="card-body">
              <span class="part-tag">Part ${index + 1}</span>
              <h2>${item.title}</h2>
              <p>${item.desc}</p>
              <div class="card-footer">
                <span>Read Article</span>
                <span class="btn-text">Open →</span>
              </div>
            </div>
          `;
          grid.appendChild(card);
        });
      </script>
    </main>

    <footer>
      © Your notes — GitHub Pages
    </footer>
  </div>
</body>
</html>
