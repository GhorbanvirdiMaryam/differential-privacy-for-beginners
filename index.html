<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Differential Privacy for Beginners</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #fcfcfc; /* پس‌زمینه روشن و تمیز مشابه عکس */
      --text-dark: #333;
      --accent: #b8d8d8; /* تم رنگی ملایم مشابه عکس دوم */
      --border: #eeeeee;
    }

    * { box-sizing: border-box; }
    
    body {
      margin: 0;
      font-family: "Inter", sans-serif;
      color: var(--text-dark);
      background-color: var(--bg-color);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* بخش بالایی صفحه */
    header {
      text-align: center;
      padding: 60px 20px 20px;
      max-width: 800px;
      margin: 0 auto;
    }

    h1 {
      font-family: 'Playfair Display', serif; /* فونت کلاسیک برای تایتل */
      font-size: 42px;
      margin-bottom: 15px;
      color: #2c3e50;
    }

    .subtitle {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #7f8c8d;
      margin-bottom: 30px;
    }

    .divider {
      width: 100px;
      height: 1px;
      background: #ccc;
      margin: 0 auto 40px;
    }

    /* کانتینر اصلی برای جمع کردن محتوا در وسط */
    .main-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 40px;
      position: relative;
      flex: 1;
    }

    /* استایل اسلایدر */
    .slider-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .card-track {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: calc(25% - 15px); /* ۴ کارت در صفحه */
      gap: 20px;
      overflow-x: auto;
      scroll-behavior: smooth;
      scrollbar-width: none; /* حذف اسکرول‌بار در فایرفاکس */
      padding: 10px 0;
    }

    .card-track::-webkit-scrollbar { display: none; } /* حذف اسکرول‌بار در کروم */

    .card {
      background: #fff;
      border: 1px solid var(--border);
      text-decoration: none;
      color: inherit;
      transition: transform 0.3s ease;
      display: flex;
      flex-direction: column;
      text-align: center;
    }

    .card:hover { transform: translateY(-5px); }

    .cover {
      width: 100%;
      aspect-ratio: 3/4; /* حالت عمودی مشابه عکس */
      background: #f9f9f9;
      overflow: hidden;
      display: block;
    }

    .cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .content {
      padding: 20px 10px;
    }

    .pill {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 13px;
      color: #999;
      margin-bottom: 10px;
      display: block;
    }

    h2 { font-size: 16px; margin: 0 0 10px; font-weight: 400; }
    .card p { font-size: 12px; color: #777; line-height: 1.4; margin: 0; }

    /* دکمه‌های چپ و راست */
    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: white;
      border: 1px solid #ddd;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .nav-btn:hover { background: #f0f0f0; }
    .prev { left: -20px; }
    .next { right: -20px; }

    /* نوار رنگی پایین صفحه */
    footer {
      height: 80px;
      background-color: var(--accent);
      margin-top: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: #555;
      border-top: 5px solid rgba(255,255,255,0.3);
    }

    @media (max-width: 1000px) {
      .card-track { grid-auto-columns: calc(50% - 10px); } /* ۲ کارت در موبایل */
    }
  </style>
</head>

<body>

  <header>
    <h1>Differential Privacy for Beginners</h1>
    <p class="subtitle">Privacy is rarely lost in one fell swoop. It is usually eroded over time, little bits dissolving almost imperceptibly until we finally begin to notice how much is gone. Daniel J. Solove</p>
    <div class="divider"></div>
  </header>

  <div class="main-container">
    <button class="nav-btn prev" onclick="scrollGrid(-1)">&#10094;</button>
    <button class="nav-btn next" onclick="scrollGrid(1)">&#10095;</button>
    
    <main class="card-track" id="slider">
      </main>
  </div>

  <footer>
    © Differential Privacy for Beginners — 2026
  </footer>

  <script>
    const grid = document.getElementById('slider');
    const parts = [
      { title: "Introduction", desc: "Background and motivation", img: "part1.png" },
      { title: "Reconstruction Attacks", desc: "How statistics reveal data", img: "part2.png" },
      // بقیه پارت‌ها (۳ تا ۱۲)
    ];

    // ایجاد ۱۲ کارت
    for (let i = 1; i <= 12; i++) {
      const data = parts[i-1] || { title: "(Next)", desc: "Coming soon", img: `part${i}.png` };
      grid.innerHTML += `
        <a class="card" href="part${i}.html">
          <div class="cover">
            <img src="${data.img}" alt="" onerror="this.src='https://via.placeholder.com/300x400?text=Part+${i}'">
          </div>
          <div class="content">
            <span class="pill">Part ${i}</span>
            <h2>${data.title}</h2>
            <p>${data.desc}</p>
          </div>
        </a>`;
    }

    // تابع جابجایی اسلایدر
    function scrollGrid(direction) {
      const scrollAmount = grid.clientWidth;
      grid.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
    }
  </script>

</body>
</html>
